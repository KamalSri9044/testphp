version: "3.8"
services:
  web:
    build: .
    ports: 
     - "8080:80"
    volumes: 
      - ./src:/var/www/html
  db:
   image: mysql:8
   environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo
      MYSQL_USER: user
      MYSQL_PASSWORD: password
   ports: 
      - "3306:3306"
  phpmyadmin:
    image: phpmyadmin
    ports: 
      - "8081:80"
    environment:
       PMA_HOST: db